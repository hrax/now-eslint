name: build

on: 
  push:
    paths-ignore: [ "**.md", ".**", "**.txt" ]
  pull_request:
    paths-ignore: [ "**.md", ".**", "**.txt" ]
  workflow_call:
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [21.x, 22.x, latest]
        os: [ubuntu-latest, windows-latest]

    name: Test on node ${{matrix.node-version}} and ${{matrix.os}}
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{matrix.node-version}}
      uses: actions/setup-node@v3
      with:
        node-version: ${{matrix.node-version}}
        cache: 'npm'
    - name: npm ci
      run: npm ci
    - name: npm test
      run: npm test
